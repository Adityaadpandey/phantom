environment:
  mode: production
  debug: false
  deterministic: false

llm:
  primary_model: gpt-4o
  fallback_model: gpt-4o-mini
  timeout: 30
  max_retries: 3
  rate_limit: 100
  circuit_breaker_threshold: 5

tasks:
  task_containment:
    topology_mode: dynamic
    injection_rate: 0.05
    max_turns: 15
  task_adaptive:
    topology_mode: dynamic
    injection_rate: 0.25
    max_turns: 25
  task_cognitive_warfare:
    topology_mode: dynamic
    injection_rate: 0.50
    max_turns: 40

dynamic_generation:
  network_templates:
    - financial_services
    - healthcare
    - manufacturing
    - tech_startup
  injection_sophistication: adaptive
  background_noise: contextual
