environment:
  mode: development
  debug: true
  deterministic: true

llm:
  primary_model: gpt-4o
  fallback_model: gpt-4o-mini
  timeout: 30
  max_retries: 3

tasks:
  task_containment:
    topology_mode: static
    preset: small_corp
    injection_rate: 0.05
    max_turns: 15
  task_adaptive:
    topology_mode: static
    preset: mid_corp
    injection_rate: 0.25
    max_turns: 25
  task_cognitive_warfare:
    topology_mode: static
    preset: enterprise
    injection_rate: 0.50
    max_turns: 40
